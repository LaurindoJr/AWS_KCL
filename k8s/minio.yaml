apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  namespace: kcl-app
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
        - minio
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: kcl-app-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kcl-app-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BROWSER
          value: 'on'
        - name: MINIO_PROMETHEUS_AUTH_TYPE
          value: public
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: minio-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: kcl-app
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
  - name: api
    protocol: TCP
    port: 9000
    targetPort: 9000
  - name: console
    protocol: TCP
    port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: kcl-app
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
  - name: api
    protocol: TCP
    port: 9000
    targetPort: 9000
    nodePort: 30000
  - name: console
    protocol: TCP
    port: 9001
    targetPort: 9001
    nodePort: 30001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: kcl-app
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - 'sleep 30

          mc alias set myminio http://minio-service.kcl-app.svc.cluster.local:9000
          ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}

          mc mb --ignore-existing myminio/book-covers

          mc policy set public myminio/book-covers

          echo "Bucket initialization completed successfully"

          '
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: kcl-app-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kcl-app-secrets
              key: MINIO_ROOT_PASSWORD
  backoffLimit: 5
